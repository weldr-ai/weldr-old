version: "3.8"

services:
  # MinIO - Local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: weldr-minio
    ports:
      - "19000:9000" # API
      - "19001:9001" # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO setup - creates default buckets
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set weldr http://minio:9000 minioadmin minioadmin;
      echo 'MinIO is ready for bucket creation';
      exit 0;
      "

volumes:
  minio_data:
